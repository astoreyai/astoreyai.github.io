services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    ports:
      - '127.0.0.1:4173:4173'
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
volumes:
  portfolio_node_modules:
